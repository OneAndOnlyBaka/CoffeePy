# Keep the kernel's own NFC stack away from the ACR122U.
#
# The reader's PN532 chip is recognised by the in-kernel pn533_usb driver, which claims
# the USB interface as soon as the device is plugged in. pcscd (running inside the
# nfc-bridge container) then cannot open it, and the kiosk sits at "Card reader not
# available" with the reader's LED happily lit. This is the single most common way an
# ACR122U ends up looking broken on Linux - see nfc-cardreader/README.md.
#
# Nothing on this device uses the kernel NFC subsystem for anything else: the reader is
# spoken to over PC/SC (libccid), which needs the raw USB device.
blacklist pn533_usb
blacklist pn533
blacklist nfc
