{% extends "base.html" %}
{% load static %}
{% block title %}:) - CoffeePy{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="{% static 'vendor/js-dos/js-dos.css' %}">
<link rel="stylesheet" href="{% static 'kiosk/kiosk.css' %}">
<script src="{% static 'vendor/js-dos/js-dos.js' %}" defer></script>
<script src="{% static 'kiosk/doom_page.js' %}" defer></script>
{% endblock %}
{% block body_class %}kiosk{% endblock %}
{% block body %}
<div class="doom-page">
    <div id="dos" class="doom-screen"
         data-exe="{% static 'kiosk/doom/DOOM.EXE' %}"
         data-wad="{% static 'kiosk/doom/DOOM1.WAD' %}"
         data-emulators-prefix="{% static 'vendor/js-dos/emulators/' %}"></div>
    <div class="doom-controls">
        <div class="dpad">
            <button type="button" class="dpad-btn dpad-up" data-key="ArrowUp">▲</button>
            <button type="button" class="dpad-btn dpad-left" data-key="ArrowLeft">◀</button>
            <button type="button" class="dpad-btn dpad-right" data-key="ArrowRight">▶</button>
            <button type="button" class="dpad-btn dpad-down" data-key="ArrowDown">▼</button>
        </div>
        <div class="dpad-actions">
            <button type="button" class="btn success dpad-action" data-key="Control">Fire</button>
            <button type="button" class="btn secondary dpad-action" data-key="Space">Use</button>
            <button type="button" class="btn secondary dpad-action" data-key="Enter">Enter</button>
            <button type="button" class="btn danger dpad-action" data-key="Escape">Esc</button>
        </div>
    </div>
    <a class="btn danger doom-exit" href="{% url 'kiosk:index' %}">✕ Exit to Kiosk</a>
</div>
{% endblock %}
