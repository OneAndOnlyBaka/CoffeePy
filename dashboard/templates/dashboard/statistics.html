{% extends "dashboard/base.html" %}
{% load static %}
{% block title %}Statistics - CoffeePy{% endblock %}
{% block dashboard_head %}<script src="{% static 'vendor/chartjs/chart.umd.min.js' %}"></script>{% endblock %}
{% block dashboard_content %}
<h1>Statistics</h1>
<div class="chart-grid">
    <div class="card"><canvas id="monthlyChart"></canvas></div>
    <div class="card"><canvas id="distributionChart"></canvas></div>
    <div class="card" style="grid-column: 1 / -1;"><canvas id="hourlyChart"></canvas></div>
    <div class="card"><canvas id="weekdayChart"></canvas></div>
    <div class="card"><canvas id="paymentMethodsChart"></canvas></div>
    <div class="card" style="grid-column: 1 / -1;"><canvas id="priceTrendChart"></canvas></div>
</div>

<script>
const monthly = {{ monthly_totals|safe }};
const distribution = {{ coffee_distribution|safe }};
const priceTrend = {{ price_trend|safe }};
const paymentMethods = {{ payment_methods|safe }};

new Chart(document.getElementById('monthlyChart'), {
    type: 'bar',
    data: {
        labels: monthly.labels,
        datasets: [
            {label: 'Orders (€)', data: monthly.orders, backgroundColor: '#6b3b00'},
            {label: 'Payments (€)', data: monthly.payments, backgroundColor: '#c98a3d'},
        ]
    },
    options: {responsive: true, plugins: {title: {display: true, text: 'Last 12 months'}}}
});

new Chart(document.getElementById('distributionChart'), {
    type: 'pie',
    data: {
        labels: distribution.labels,
        datasets: [{data: distribution.counts, backgroundColor: ['#6b3b00', '#c98a3d', '#a9744f', '#3b2314', '#e6d4c1', '#b3261e', '#2f7a3d']}]
    },
    options: {responsive: true, plugins: {title: {display: true, text: 'Coffee sort distribution (all time)'}}}
});

const hourly = {{ hourly_distribution|safe }};
const weekday = {{ weekday_distribution|safe }};

function peakLabel(data, format) {
    const max = Math.max(...data.cups);
    if (max <= 0) {
        return 'no orders yet';
    }
    return format(data.labels[data.cups.indexOf(max)], max);
}

new Chart(document.getElementById('hourlyChart'), {
    type: 'bar',
    data: {
        labels: hourly.labels,
        datasets: [{label: 'Cups', data: hourly.cups, backgroundColor: '#6b3b00'}]
    },
    options: {
        responsive: true,
        scales: {x: {title: {display: true, text: 'Hour of day'}}, y: {beginAtZero: true}},
        plugins: {
            legend: {display: false},
            title: {
                display: true,
                text: 'Cups by hour of day (all time) - busiest: ' +
                    peakLabel(hourly, (label, cups) => `${label}:00 with ${cups} cups`),
            }
        }
    }
});

new Chart(document.getElementById('weekdayChart'), {
    type: 'bar',
    data: {
        labels: weekday.labels,
        datasets: [{label: 'Cups', data: weekday.cups, backgroundColor: '#c98a3d'}]
    },
    options: {
        responsive: true,
        scales: {y: {beginAtZero: true}},
        plugins: {
            legend: {display: false},
            title: {
                display: true,
                text: 'Cups by weekday (all time) - busiest: ' +
                    peakLabel(weekday, (label, cups) => `${label} with ${cups} cups`),
            }
        }
    }
});

const colors = ['#6b3b00', '#c98a3d', '#a9744f', '#3b2314', '#b3261e', '#2f7a3d', '#4a6fa5'];
new Chart(document.getElementById('priceTrendChart'), {
    type: 'line',
    data: {
        labels: priceTrend.labels,
        datasets: Object.entries(priceTrend.series).map(([name, values], i) => ({
            label: name, data: values, borderColor: colors[i % colors.length], spanGaps: true,
        }))
    },
    options: {responsive: true, plugins: {title: {display: true, text: 'Average order price per quarter'}}}
});

new Chart(document.getElementById('paymentMethodsChart'), {
    type: 'pie',
    data: {
        labels: paymentMethods.labels,
        datasets: [{data: paymentMethods.totals, backgroundColor: ['#6b3b00', '#c98a3d', '#a9744f', '#3b2314', '#e6d4c1', '#b3261e', '#2f7a3d']}]
    },
    options: {responsive: true, plugins: {title: {display: true, text: 'Payments received by method (€, all time)'}}}
});
</script>
{% endblock %}
