services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z
    restart: unless-stopped

  acr122u-mqtt:
    build: .
    image: acr122u-mqtt-bridge:latest
    container_name: acr122u-mqtt
    depends_on:
      - mosquitto
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC: nfc/acr122u
      LOG_LEVEL: INFO
    restart: unless-stopped

  mqtt-client:
    image: eclipse-mosquitto:2
    container_name: mqtt-client
    depends_on:
      - mosquitto
    entrypoint: ["mosquitto_sub", "-h", "mosquitto", "-t", "nfc/acr122u/#", "-v"]
    restart: unless-stopped
