# Exceptions to the CI audit (.github/workflows/ci.yml, job "audit"), which otherwise fails on
# every vulnerability a newer release fixes. Each entry says why that fix can't be taken yet -
# drop it as soon as it can (and the audit will tell once the reason is gone: a newer
# base image without the finding makes the rule simply match nothing).
ignore:
  # Fixed only in CPython 3.15, not backported to 3.14 - which is the newest Python that Django
  # 5.2 (this app's LTS) supports. Not reachable here: it is a command injection through newlines
  # in poplib's commands, and neither the app nor the bridge imports poplib (no e-mail at all).
  # Revisit with the move to a Django that supports 3.15.
  - vulnerability: CVE-2025-15367
    package:
      name: python
      type: binary
    reason: "poplib only, which nothing here imports; fixed only in Python 3.15, which Django 5.2 LTS does not support"
