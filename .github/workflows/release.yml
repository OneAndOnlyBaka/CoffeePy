name: Release

# Builds everything an offline Pi deployment needs and publishes it:
#   1. The individual coffeepy-web / coffeepy-nfc-bridge images, pushed to GHCR.
#   2. The offline update bundle (scripts/build_update_bundle.sh output) - images +
#      docker-compose.yml in one tar, uploadable at /dashboard/update/.
#
# The device itself is set up with install/install.sh on Raspberry Pi OS Lite; there is no
# image to build here.
#
# Triggered by pushing a tag (attaches everything to a GitHub Release) or manually via
# workflow_dispatch (produces the same artifacts without a release, e.g. to test).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      platform:
        # Must match the Raspberry Pi OS the device runs, or it rejects the bundle's
        # images with "exec format error": linux/arm/v7 for the 32-bit OS (the right
        # choice on a 1GB Pi 3B), linux/arm64 for the 64-bit one.
        description: "Target platform for the images/update bundle"
        required: false
        default: "linux/arm/v7"
        type: choice
        options: ["linux/arm/v7", "linux/arm64"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images-and-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Prepare .env (docker-compose.yml's env_file directive needs it to exist)"
        run: cp .env.example .env

      - name: Build coffeepy-web + nfc-bridge (docker-compose.yml is the source of truth)
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ inputs.platform || 'linux/arm/v7' }}
        run: docker compose build

      - name: Push individual images to GHCR
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag="${{ steps.tag.outputs.tag }}"

          web_image="${{ env.REGISTRY }}/$owner/coffeepy-web"
          docker tag coffeepy-web:latest "$web_image:$tag"
          docker tag coffeepy-web:latest "$web_image:latest"
          docker push "$web_image:$tag"
          docker push "$web_image:latest"

          # nfc-bridge has no explicit `image:` in docker-compose.yml, so compose
          # auto-names it - find whatever that name turned out to be rather than
          # hand-guessing the project-name prefix.
          nfc_local=$(docker compose config --images | grep nfc-bridge)
          nfc_image="${{ env.REGISTRY }}/$owner/coffeepy-nfc-bridge"
          docker tag "$nfc_local" "$nfc_image:$tag"
          docker tag "$nfc_local" "$nfc_image:latest"
          docker push "$nfc_image:$tag"
          docker push "$nfc_image:latest"

      - name: Build offline update bundle
        run: |
          ./scripts/build_update_bundle.sh \
            "${{ inputs.platform || 'linux/arm/v7' }}" \
            "coffeepy-update-${{ steps.tag.outputs.tag }}.tar"

      - uses: actions/upload-artifact@v4
        with:
          name: update-bundle
          path: coffeepy-update-*.tar

      - name: Attach to GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag="${{ steps.tag.outputs.tag }}"
          gh release create "$tag" --title "$tag" --generate-notes --notes "Images: ${{ env.REGISTRY }}/$owner/coffeepy-web:$tag and ${{ env.REGISTRY }}/$owner/coffeepy-nfc-bridge:$tag" || true
          gh release upload "$tag" coffeepy-update-*.tar --clobber
