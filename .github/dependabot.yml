# Weekly PRs for what the build depends on, so the CI audit (ci.yml, job "audit") stays green
# by small steps instead of turning red all at once. Each PR runs the full CI - tests on SQLite
# and PostgreSQL, the audit, the lint - before anything is merged.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups:
      python: {patterns: ["*"]}
    ignore:
      # The app stays on Django's LTS release (5.2, supported until April 2028): a major is a
      # decision with its own upgrade work, not a weekly update - the grouped PR once took it
      # from 5.2 to 6.1 unnoticed. Security fixes to the LTS still arrive as patch updates.
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /nfc-cardreader
    schedule: {interval: weekly}
    groups:
      nfc-bridge: {patterns: ["*"]}

  # The python base image of the app, the test image and the bridge.
  - package-ecosystem: docker
    directories: ["/", "/nfc-cardreader"]
    schedule: {interval: weekly}
    ignore:
      # A Python minor version is a decision (Django has to support it), not a weekly update.
      # "*": Dependabot names Docker Hub's official images "library/python" in some files.
      - dependency-name: "*python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # postgres, mosquitto and caddy, pinned to exact versions so that two builds of one commit
  # ship the same images. A PostgreSQL major means a dump and restore of every device's
  # database - never a weekly update.
  - package-ecosystem: docker-compose
    directories: ["/", "/nfc-cardreader"]
    schedule: {interval: weekly}
    ignore:
      # "*": here it is "library/postgres" - a plain "postgres" let PR #17 (16 -> 18) through.
      - dependency-name: "*postgres"
        update-types: ["version-update:semver-major"]

  # The actions, pinned to commits in the workflows - Dependabot moves the pin and its comment.
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
