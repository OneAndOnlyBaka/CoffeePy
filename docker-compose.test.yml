# The test suite against a real PostgreSQL 16 - the server version the device runs - with
# coverage measured. Run it with scripts/test.sh (docker or podman, whichever is there).
#
#   scripts/test.sh                      everything
#   scripts/test.sh dashboard.tests.test_backup
services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: coffeepy
      POSTGRES_USER: coffeepy
      POSTGRES_PASSWORD: coffeepy
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffeepy"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: test
      POSTGRES_HOST: db
      COFFEEPY_REAL_POSTGRES: "1"
    volumes:
      - .:/app:z
    entrypoint: ["sh", "-c"]
    command: ["coverage run manage.py test $${TEST_LABELS} && coverage report"]
